name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  smoke_minimal_install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package only (no dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Smoke import primary API
        run: |
          python -c "import moju; import plotly; import reportlab; from moju.monitor import ResidualEngine, audit, visualize; print('ok', moju.__version__)"

  smoke_studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev + studio
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,studio]"
      - name: Smoke import Studio science loaders
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from apps.moju_studio.studio_io import load_h5_bytes, load_netcdf_bytes, load_npy_bytes; print('studio_io ok')"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  test_io_extras:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (dev + io)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io]"

      - name: Sanity check io extra imports
        run: |
          python -c "import xarray; import meshio; import h5py; import moju.monitor.state_ref; print('io extras ok')"

      - name: Run tests
        run: pytest
