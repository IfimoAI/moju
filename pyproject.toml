[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moju"
version = "1.1.3"
description = "Physics supervision and audit tools for SciML models, with JAX-native residuals and PyTorch support."
readme = "README.md"
authors = [{ name = "Ifimo Lab", email = "lab@ifimoanalytics.com" }]
maintainers = [
  { name = "Ifimo Analytics", email = "info@ifimoanalytics.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["physics", "jax", "torch", "pytorch", "sciml", "pinn", "dimensionless", "cfd", "differentiable", "residual"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=1.20.0",
    "plotly>=5.18.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
io = [
    "xarray>=2023.1.0",
    "h5py>=3.8.0",
    "meshio>=5.3.0",
    "netCDF4>=1.6.0",
    "scipy>=1.10.0",
]
studio = [
    "streamlit>=1.33.0",
    "xarray>=2023.1.0",
    "h5py>=3.8.0",
    "netCDF4>=1.6.0",
]
torch = ["torch>=2.0.0", "jax2torch>=0.0.7"]
dev = ["pytest", "black", "ruff"]

[project.urls]
Homepage = "https://ifimoai.github.io/moju/"
Documentation = "https://ifimoai.github.io/moju/doc/overview.html"
Source = "https://github.com/IfimoAI/moju"
Paper = "https://zenodo.org/records/20519331"
Changelog = "https://github.com/IfimoAI/moju/blob/main/CHANGELOG.md"
Issues = "https://github.com/IfimoAI/moju/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["moju*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
